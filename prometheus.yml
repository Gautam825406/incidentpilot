# Minimal Prometheus config for the optional `monitoring` compose profile.
# It scrapes itself, and the IncidentPilot backend's /metrics endpoint
# (Phase 6: aggregate counters from the simulated services' emitted
# telemetry — see backend/app/telemetry.py and GET /metrics in
# backend/app/main.py). In compose the backend is reachable as
# `backend:8000`; when Prometheus runs outside compose, use
# `localhost:8000` instead.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'incidentpilot-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics
